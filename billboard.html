<style>
:root{--good:#12894a;--bad:#cc2020;--ink:#0f1115;--muted:#6b7280;--border:#e4e6e9;--led:#ff5a14;--navy:#0b1f3a;--burgundy:#4a1014}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;font-family:'Heebo',system-ui,sans-serif;color:#fff}
.world{position:relative;width:100%;height:100%;background:#6ea0c8 url('billboard-scene.jpg') center 42%/cover no-repeat}
.world::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,16,28,.12) 0%,rgba(8,16,28,.05) 40%,rgba(20,14,8,.28) 100%);pointer-events:none}
.stage{position:relative;z-index:1;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:3vh 3vw 11vh;direction:ltr}
.structure{width:min(94vw,1240px);filter:drop-shadow(0 22px 28px rgba(0,0,0,.38));transform:perspective(1800px) rotateX(4deg);transform-origin:center bottom}
.frame{background:#1a1c1f;padding:10px 10px 0;border-radius:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 0 0 2px #0d0e10}
.face{position:relative;aspect-ratio:2.55/1;background:#050608;overflow:hidden;display:grid;grid-template-columns:1fr .86fr 1fr}
.panel{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:6% 7% 10%;min-width:0}
.after{background:linear-gradient(180deg,#5c141c 0%,#3a0c12 55%,#2a080d 100%)}
.before{background:linear-gradient(180deg,#123056 0%,#0b1f3a 55%,#071326 100%)}
.center{position:relative;background:radial-gradient(ellipse at 50% 80%,#1a120c 0%,#050608 70%)}
.label{direction:rtl;font-size:clamp(.62rem,1.35vw,.92rem);font-weight:700;letter-spacing:.04em;color:rgba(255,255,255,.88);margin-bottom:.55em;max-width:100%;line-height:1.25;transition:opacity .45s ease,transform .45s ease}
.led-row{display:flex;align-items:baseline;justify-content:center;gap:.28em;max-width:100%;min-height:1.1em}
.led{font-family:'Orbitron',ui-monospace,monospace;font-weight:800;font-size:clamp(1.55rem,5.4vw,4.35rem);line-height:1;color:var(--led);letter-spacing:.03em;text-shadow:0 0 6px rgba(255,70,10,.95),0 0 18px rgba(255,80,0,.55),0 0 36px rgba(255,40,0,.28);white-space:nowrap;transition:opacity .45s ease,transform .45s ease}
.led.bad{color:#ff3b1f;text-shadow:0 0 6px rgba(255,40,20,.95),0 0 18px rgba(204,32,32,.55)}
.led.good{color:#3dff8a;text-shadow:0 0 6px rgba(18,137,74,.95),0 0 18px rgba(18,137,74,.45)}
.led.flat{color:#d9dde3;text-shadow:0 0 8px rgba(255,255,255,.25)}
.unit{font-size:clamp(.7rem,1.5vw,1.05rem);font-weight:700;color:rgba(255,255,255,.82);white-space:nowrap}
.headline{direction:rtl;margin-top:.7em;display:flex;flex-direction:column;align-items:center;line-height:.92;color:#fff}
.headline .kicker{font-size:clamp(.7rem,1.45vw,1.05rem);font-weight:700;letter-spacing:.04em;opacity:.92}
.headline .main{font-weight:900;letter-spacing:-.03em}
.after .headline .main{font-size:clamp(1.55rem,4.2vw,3.15rem)}
.before .headline .main{font-size:clamp(1.05rem,2.5vw,1.85rem);opacity:.95}
.source{direction:rtl;margin-top:.55em;font-size:clamp(.48rem,.95vw,.68rem);font-weight:500;letter-spacing:.04em;color:rgba(255,255,255,.62)}
.person{position:absolute;left:50%;bottom:-1%;transform:translateX(-42%);height:128%;width:auto;max-width:54%;object-fit:contain;object-position:center bottom;z-index:5;pointer-events:none;mix-blend-mode:lighten;filter:drop-shadow(0 10px 18px rgba(0,0,0,.55))}
.catwalk{height:18px;background:linear-gradient(#2a2d32,#111),repeating-linear-gradient(90deg,rgba(255,255,255,.06) 0 2px,transparent 2px 9px);border-top:1px solid #444;position:relative}
.catwalk::before,.catwalk::after{content:"";position:absolute;top:-7px;width:100%;height:7px;background:repeating-linear-gradient(90deg,#c5c8cc 0 7px,transparent 7px 22px);opacity:.55}
.legs{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;height:clamp(56px,10vh,110px);gap:8%;padding:0 10%}
.leg{background:
  repeating-linear-gradient(180deg,#1c1c1c 0 7px,transparent 7px 16px),
  repeating-linear-gradient(45deg,rgba(90,90,90,.85) 0 2px,transparent 2px 12px),
  repeating-linear-gradient(-45deg,rgba(70,70,70,.85) 0 2px,transparent 2px 12px),
  #111;clip-path:polygon(18% 0,82% 0,70% 100%,30% 100%);box-shadow:inset 0 0 0 1px #000}
.shadow{height:18px;margin:2px 8% 0;background:radial-gradient(ellipse at center,rgba(0,0,0,.45) 0%,rgba(0,0,0,0) 70%)}
.strip{direction:rtl;position:absolute;left:0;right:0;bottom:0;height:9%;background:#0a0a0c;display:flex;align-items:center;justify-content:center;z-index:6;font-size:clamp(.52rem,1.05vw,.78rem);font-weight:500;color:rgba(255,255,255,.7);letter-spacing:.04em}
.hide{opacity:0;transform:translateY(8px)}
.speed-control{position:fixed;left:clamp(12px,2vw,24px);bottom:clamp(12px,2vh,24px);z-index:20;display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 18px rgba(15,17,21,.12);min-width:148px;direction:rtl;color:var(--ink)}
.speed-control label{font-size:.9rem;font-weight:700;letter-spacing:-.015em}
.speed-control .value{font-size:.85rem;font-weight:500;color:var(--muted)}
.speed-control input[type=range]{width:100%;accent-color:var(--ink);cursor:pointer}
.credit{position:fixed;right:12px;bottom:10px;z-index:20;font-size:.68rem;color:rgba(255,255,255,.72);text-shadow:0 1px 2px rgba(0,0,0,.45);direction:ltr}
.credit a{color:inherit;text-decoration:underline;text-underline-offset:2px}
@media(max-width:720px){
  .stage{padding-bottom:16vh}
  .face{grid-template-columns:1fr .7fr 1fr}
  .person{max-width:52%;height:108%}
  .led{font-size:clamp(1.15rem,6.2vw,2.2rem)}
  .label{letter-spacing:.06em}
}
@media(prefers-reduced-motion:reduce){.label,.led{transition:none}}
</style>
</head>

M.forEach(m=>m.s=build(m.k,m.w));

const RANGE=60,FADE=450;
let intervalMs=7000,timer;
const $=id=>document.getElementById(id);
const els={
  afterLabel:$('afterLabel'), beforeLabel:$('beforeLabel'),
  afterNum:$('afterNum'), beforeNum:$('beforeNum'),
  afterUnit:$('afterUnit'), beforeUnit:$('beforeUnit')
};

function fmt(m,v){return m.ret?num(v,0):m.fv(v)}
function nowVal(m){return m.s[60]}
function thenVal(m){return m.s[60-RANGE]}
function colourFor(m){
  const now=m.s[60],then=m.s[60-RANGE],d=now-then;
  const noChange=Math.abs(d)<(m.ret?.5:Math.abs(now)*.0015);
  if(noChange||m.dir==='none')return'flat';
  return(m.dir==='up')===(d>0)?'good':'bad';
}
function splitFmt(str){
  const s=String(str).trim();
  const m=s.match(/^([+\-]?\d[\d,]*(?:\.\d+)?)\s*(.*)$/);
  if(!m) return {led:s, unit:''};
  return {led:m[1], unit:m[2]};
}
function fitNumber(el){
  el.style.fontSize='';
  const wrap=el.parentElement;
  let size=parseFloat(getComputedStyle(el).fontSize);
  while(wrap && el.scrollWidth>wrap.clientWidth && size>14){size-=2;el.style.fontSize=size+'px'}
}
function applySide(labelEl,numEl,unitEl,text,value){
  const p=splitFmt(value);
  labelEl.textContent=text;
  numEl.textContent=p.led;
  unitEl.textContent=p.unit;
}
function show(m){
  applySide(els.beforeLabel,els.beforeNum,els.beforeUnit,m.n,fmt(m,thenVal(m)));
  applySide(els.afterLabel,els.afterNum,els.afterUnit,m.n,fmt(m,nowVal(m)));
  els.afterNum.className='led '+colourFor(m);
  fitNumber(els.beforeNum);
  fitNumber(els.afterNum);
}
function fadeEls(){return [els.afterLabel,els.beforeLabel,els.afterNum,els.beforeNum,els.afterUnit,els.beforeUnit]}
function swap(next){
  fadeEls().forEach(el=>el.classList.add('hide'));
  setTimeout(()=>{show(next);fadeEls().forEach(el=>el.classList.remove('hide'))},FADE);
}
const pool=M.slice().sort((a,b)=>{
  const rank=c=>colourFor(c)==='bad'?0:colourFor(c)==='flat'?1:2;
  return rank(a)-rank(b);
});
let i=0;
function tick(){i=(i+1)%pool.length;swap(pool[i])}
function startLoop(){
  clearInterval(timer);
  timer=setInterval(tick,intervalMs);
}
function setSpeed(sec){
  intervalMs=sec*1000;
  $('speedValue').textContent='כל '+sec+' שניות';
  $('speedSlider').setAttribute('aria-valuenow',sec);
  startLoop();
}
show(pool[0]);
startLoop();
$('speedSlider').addEventListener('input',e=>setSpeed(+e.target.value));
window.addEventListener('resize',()=>{fitNumber(els.beforeNum);fitNumber(els.afterNum)});
</script>
