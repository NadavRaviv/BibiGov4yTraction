:root{--good:#12894a;--bad:#cc2020;--ink:#0f1115;--muted:#6b7280;--line:#a8adb5;--border:#e4e6e9}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
html,body{height:100%;overflow:hidden;background:#8ec8ef;font-family:'Heebo',system-ui,sans-serif;color:var(--ink)}
.stage{position:relative;width:100%;height:100%;display:grid;place-items:center;padding:clamp(8px,1.5vh,24px)}
.billboard{position:relative;width:min(96vw,1400px);aspect-ratio:1400/620;filter:drop-shadow(0 16px 36px rgba(0,0,0,.28))}
.billboard .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.overlay{position:absolute;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;z-index:2}
.overlay .year{font-size:clamp(.72rem,1.2vw,.78rem);font-weight:500;color:rgba(255,255,255,.82);letter-spacing:.04em;margin-bottom:.45em}
.overlay .number{font-size:clamp(1.8rem,5.8vw,5rem);font-weight:800;line-height:1.02;letter-spacing:-.02em;word-break:break-word;max-width:100%;white-space:nowrap;transition:opacity .45s ease,transform .45s ease}
.after-side{left:5.5%;top:8%;width:28%;height:62%}
.before-side{right:5.5%;top:8%;width:28%;height:62%}
.before-side .number{color:#fff}
.after-side .number{color:#fff}
.after-side .number.bad{color:var(--bad)}
.after-side .number.good{color:var(--good)}
.after-side .number.flat{color:var(--muted)}
.center-person{position:absolute;left:50%;bottom:12%;transform:translateX(-50%);height:88%;width:auto;max-width:42%;object-fit:contain;object-position:bottom center;z-index:3;pointer-events:none}
.category-wrap{position:absolute;left:8%;right:8%;bottom:2.2%;height:11%;display:flex;align-items:center;justify-content:center;z-index:4}
.category{font-size:clamp(1.05rem,2.2vw,1.75rem);font-weight:700;color:var(--ink);letter-spacing:-.015em;text-align:center;transition:opacity .45s ease,transform .45s ease}
.category.hide,.number.hide{opacity:0;transform:translateY(10px)}
.speed-control{position:fixed;left:clamp(12px,2vw,24px);bottom:clamp(12px,2vh,24px);z-index:20;display:flex;flex-direction:column;gap:6px;padding:10px 12px;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 4px 18px rgba(15,17,21,.08);min-width:148px;direction:rtl}
.speed-control label{font-size:.9rem;font-weight:700;color:var(--ink);letter-spacing:-.015em}
.speed-control .value{font-size:.85rem;font-weight:500;color:var(--muted)}
.speed-control input[type=range]{width:100%;accent-color:var(--ink);cursor:pointer}
@media(max-width:700px){
  .after-side,.before-side{width:34%;top:10%;height:48%}
  .center-person{height:52%;max-width:42%;bottom:16%}
  .overlay .number{font-size:clamp(1.3rem,7vw,2.4rem)}
}
@media(prefers-reduced-motion:reduce){.category,.number{transition:none}}
</style>

{n:'תיקי אלימות גופנית (שנתי)',c:'פשע',dir:'down',w:280,k:[[0,52000],[12,53000],[24,55000],[36,60256],[48,60342],[54,62000],[60,63500]],fv:v=>num(v),fd:v=>num(v)},

{n:'ישראלים שהיגרו',c:'דמוגרפיה',dir:'down',w:.8,k:[[0,40],[12,43],[24,49],[30,62],[36,79],[40,83],[46,74],[48,71],[54,69.3],[60,63]],fv:thou(1),fd:thou(1)}
];
M.forEach(m=>m.s=build(m.k,m.w));

const RANGE=60,FADE=450;
let intervalMs=7000,timer;
const $=id=>document.getElementById(id);
const els={cat:$('category'),before:$('beforeNum'),after:$('afterNum')};

function fmt(m,v){return m.ret?num(v,0):m.fv(v)}
function colourFor(m){
  const now=m.s[60],then=m.s[60-RANGE],d=now-then;
  const noChange=Math.abs(d)<(m.ret?.5:Math.abs(now)*.0015);
  if(noChange||m.dir==='none')return'flat';
  return(m.dir==='up')===(d>0)?'good':'bad';
}
function fitNumber(el){
  el.style.fontSize='';
  let size=parseFloat(getComputedStyle(el).fontSize);
  while(el.scrollWidth>el.clientWidth&&size>16){size-=2;el.style.fontSize=size+'px'}
}
function show(m){
  const then=m.s[60-RANGE],now=m.s[60];
  els.cat.textContent=m.c;
  els.before.textContent=fmt(m,then);
  els.after.textContent=fmt(m,now);
  els.after.className='number '+colourFor(m);
  fitNumber(els.before);
  fitNumber(els.after);
}
function swap(next){
  [els.cat,els.before,els.after].forEach(el=>el.classList.add('hide'));
  setTimeout(()=>{show(next);[els.cat,els.before,els.after].forEach(el=>el.classList.remove('hide'))},FADE);
}
const pool=M.slice().sort((a,b)=>{
  const rank=c=>colourFor(c)==='bad'?0:colourFor(c)==='flat'?1:2;
  return rank(a)-rank(b);
});
let i=0;
function tick(){i=(i+1)%pool.length;swap(pool[i])}
function startLoop(){
  clearInterval(timer);
  timer=setInterval(tick,intervalMs);
}
function setSpeed(sec){
  intervalMs=sec*1000;
  $('speedValue').textContent='כל '+sec+' שניות';
  $('speedSlider').setAttribute('aria-valuenow',sec);
  startLoop();
}
show(pool[0]);
startLoop();
$('speedSlider').addEventListener('input',e=>setSpeed(+e.target.value));
window.addEventListener('resize',()=>{fitNumber(els.before);fitNumber(els.after)});
</script>
